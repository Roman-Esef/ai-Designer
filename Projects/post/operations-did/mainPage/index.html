<!DOCTYPE html>
<!-- FIDELITY-GATE: N/A · нет исходного макета · 10.09.2026 -->
<html lang="ru">
<head>
<script>window.__DS_ROOT = '../../../../DS-IBP/';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Главная — IBP</title>
<link rel="icon" type="image/svg+xml" href="../../../../DS-IBP/assets/logo.svg">
<link rel="stylesheet" href="../../../../DS-IBP/ds.css">
<style>
  /* ---------- главная страница: только раскладка на токенах ---------- */
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); }

  /* фоновая иллюстрация — только на главной (background-illustration, cover) */
  .home-wrap { position: relative; min-height: calc(100vh - var(--layout-crumbs-h)); }
  .home-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("../../../../DS-IBP/assets/illustrations/background-illustration.svg") center/cover no-repeat;
    opacity: .6;
    pointer-events: none;
  }

  /* Сетка групп — штатная .grid12 из ДС (12 колонок, зазор 16px). Экран своей
     сетки не строит: ширину группы дают .col-3 (широкая) и .colw-6 (узкая),
     см. Каркас экрана, раздел «Стартовая страница: состав и отступы».
     Здесь остаётся только то, что сетке не принадлежит: подъём над фоновой
     иллюстрацией (она абсолютная в .home-wrap) и внутренняя раскладка группы. */
  .home-groups { position: relative; }
  .home-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .home-group .ntile { width: auto; min-width: 0; }
  .home-group__head {
    font: var(--type-h5-strong);
    color: var(--text-primary);
    margin: 0;
  }
  /* Перестроение: 4 колонки только при широкой рабочей области (rail-1920);
     при закреплении панели (область уже) — 2 колонки, дальше 1.
     Первый шаг — штатный механизм пары .col-N/.colw-N (Сетка и отступы).
     Второй шаг парой не выражается и пишется экраном, но ОБЯЗАН иметь ту же
     специфичность (0,2,0) и стоять ниже: правило пары — .grid12 > [class*="colw-"],
     и «.home-group { span 12 }» (0,1,0) ему проиграло бы — на 900px группы
     остались бы в 6 колонках. */
  @container screen (max-width: 1700px) { .grid12 > [class*="colw-"] { grid-column: span var(--colw); } }
  @container screen (max-width: 900px)  { .grid12 > .home-group { grid-column: span 12; } }
</style>
</head>
<body>
<div class="nav-layout">
  <!-- меню строится экранным скриптом из ibp-home.js по выбранной роли -->
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню"></nav>

  <div class="screen">
    <nav class="crumbs" aria-label="Хлебные крошки">
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page">Главная</span>
      </li>
    </nav>
    <main class="screen__content">
      <div class="home-wrap">
        <!-- тайлы строятся экранным скриптом из ibp-home.js по роли -->
        <div class="grid12 home-groups" id="home-groups"></div>
      </div>
    </main>
  </div>
</div>

<!-- модалка смены роли (триггер — кнопка выхода в футере панели) -->
<div class="modal-scrim" id="role-modal" hidden>
  <div class="modal modal--w3" role="dialog" aria-modal="true" aria-labelledby="role-modal-title">
    <header class="modal__head">
      <h2 class="modal__title" id="role-modal-title">Сменить роль</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" data-modal-close aria-label="Закрыть"><i data-icon="close"></i></button>
    </header>
    <div class="modal__body">
      <p style="font:var(--type-body-m);color:var(--text-secondary);margin:0 0 16px;">Роль определяет состав групп меню навигации и тайлов главной страницы.</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
        <button type="button" class="btn btn--outline btn--m" data-role="Финансист ДИД" data-modal-close><span class="btn__label">Финансист ДИД</span></button>
      </div>
    </div>
  </div>
</div>

<script src="../../../../DS-IBP/scripts/ds.js"></script>
<script src="../../../../DS-IBP/scripts/ibp-home.js"></script>
<script>
/* экранный скрипт: меню панели и тайлы главной строятся из единого каталога
   ibp-home.js (window.IBPHome) по выбранной роли; переключение роли — модалкой */
(function () {
  'use strict';
  var role = window.IBPHome.defaultRole;
  /* ссылки на собранные экраны направления (по id пунктов каталога ibp-home.js).
     Каталог не трогаем: он общий для ДС, а пути к экранам знает только этот экран.
     Пункты без реальной страницы остаются href="#". */
  var PAGE_HREFS = { 'current-portfolio': '../Portfolio-did/Portfolio.html' };

  function ic(name) { return '<i data-icon="' + name + '"></i>'; }
  function pageHref(id) { return PAGE_HREFS[id] || '#'; }

  function itemHTML(it) {
    /* пункт с тайлом-со-ссылками — аккордеон-родитель (под-пункты = ссылки тайла) */
    if (it.tile && it.tile.links && it.tile.links.length) {
      var sub = '<div class="nav__sub" id="nav-sub-' + it.id + '"><div class="nav__sub-in">'
        + it.tile.links.map(function (l) { return '<a class="nav__item" href="#"><span class="nav__label">' + l + '</span></a>'; }).join('')
        + '</div></div>';
      return '<a class="nav__item nav__item--acc" href="#" aria-expanded="false" aria-controls="nav-sub-' + it.id + '">'
        + '<span class="nav__ico">' + ic(it.icon) + '</span>'
        + '<span class="nav__label">' + it.label + '</span>'
        + '<span class="nav__caret">' + ic('chevron-down') + '</span></a>' + sub;
    }
    var badge = it.badge
      ? '<span class="nav__badge"><span class="badge badge--xs badge--accent" aria-hidden="true">' + it.badge + '</span></span>'
      : '';
    return '<a class="nav__item" href="' + pageHref(it.id) + '"><span class="nav__ico">' + ic(it.icon) + '</span>'
      + '<span class="nav__label">' + it.label + '</span>' + badge + '</a>';
  }

  function buildNav() {
    var nav = document.getElementById('nav');
    var s = '<div class="nav__top">'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Свернуть меню">' + ic('left-menu') + '</button>'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель">' + ic('pin-menu') + '</button>'
      + '</div>';
    s += '<div class="nav__list">';
    s += '<a class="nav__item nav__item--selected" href="#" aria-current="page"><span class="nav__ico">' + ic('main-page') + '</span><span class="nav__label">Главная</span></a>';
    IBPHome.itemsFor(role).forEach(function (g, i) {
      s += '<div class="nav__block' + (i === 0 ? ' nav__block--first' : '') + '">';
      s += '<div class="nav__block-label">' + g.label + '</div>';
      g.items.forEach(function (it) { s += itemHTML(it); });
      s += '</div>';
    });
    s += '</div>';
    s += (window.IBPHome && window.IBPHome.footerHTML)
      ? window.IBPHome.footerHTML(role, { logoutModal: 'role-modal', logoutLabel: 'Сменить роль / выйти' })
      : '<div class="nav__footer">'
        + '<a class="nav__user" href="#" aria-label="Открыть личный кабинет">'
        + '<span class="av av--circular av--m"><span class="av__text">АП</span></span>'
        + '<span class="nav__user-text">'
        + '<span class="nav__user-name">Александров Петр Константинович</span>'
        + '<span class="nav__user-role">' + role + '</span>'
        + '</span></a>'
        + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" data-modal="role-modal" aria-label="Сменить роль / выйти"><i data-icon="logout"></i></button>'
        + '</div>';
    nav.innerHTML = s;
    if (window.DSNavPanel) window.DSNavPanel.bind(nav);
    if (window.DSModal) window.DSModal.bindAll(nav); /* data-modal на динамическом триггере */
  }

  function buildTiles() {
    var host = document.getElementById('home-groups');
    var html = '';
    IBPHome.itemsFor(role).forEach(function (g) {
      var tiles = g.items.filter(function (it) { return it.tile; });
      if (!tiles.length) return;
      html += '<section class="home-group col-3 colw-6">';
      html += '<h2 class="home-group__head">' + g.label + '</h2>';
      /* тайл целиком — ссылка на раздел; для собранных экранов подменяем первый
         href="#" (ссылка-обёртка тайла) на реальный путь (разметка — IBPHome.tileHTML) */
      html += tiles.map(function (it) {
        var h = IBPHome.tileHTML(it);
        if (PAGE_HREFS[it.id]) h = h.replace('href="#"', 'href="' + PAGE_HREFS[it.id] + '"');
        return h;
      }).join('');
      html += '</section>';
    });
    host.innerHTML = html;
  }

  function paintAll() {
    if (window.dsIcons) window.dsIcons.apply(document);
    if (window.DSIllustrations) window.DSIllustrations.render();
  }

  function setRole(r) {
    if (!window.IBPHome.roles[r]) return;
    role = r;
    buildNav(); buildTiles(); paintAll();
  }

  document.querySelectorAll('#role-modal [data-role]').forEach(function (btn) {
    btn.addEventListener('click', function () { setRole(btn.getAttribute('data-role')); });
  });

  buildNav(); buildTiles(); paintAll();
})();
</script>
</body>
</html>
