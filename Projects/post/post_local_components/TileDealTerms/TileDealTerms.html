<!-- Локальный компонент «Сроки сделки» — фрагмент страницы сделки.
     Вшивается ассемблером (../../assemble.mjs) по метке ds-include на экране.
     Здесь только разметка: внешние отступы и место в колонках задаёт экран.
     data-state — состояние данных: loading | data | partial | empty.
                  Состояния «Ошибка» у тайла нет (решение человека 22.09.2026)
     data-mode  — режим прав:       edit | view. Ставит страница: статус сделки,
                  не допускающий правку, даёт view при любой роли
     Разметка держит ВСЕ состояния сразу, показывает нужное TileDealTerms.css по
     этим двум атрибутам — так же, как тайл «КНР».
     Даты ниже — пример. На странице сделки их заменяет TileDealTerms.js
     (PostTileDealTerms.render) датами сделки; пока они грузятся, тайл стоит в
     loading. Окно правки открывается с data-modal-guarded: в нём ввод, и клик
     мимо окна не должен его сбросить. -->
<section class="tile lc-deal-terms" data-state="data" data-mode="edit">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Сроки сделки</h3></div>
    </div>
    <!-- Действие шапки — только в edit и только когда даты есть (data, partial).
         В просмотре его нет вовсе, пустой тайл заполняют кнопкой в теле. -->
    <div class="tile__actions">
      <button type="button" class="ibtn ibtn--neutral ibtn--m"
              aria-label="Редактировать" data-modal="deal-terms-scrim" data-modal-guarded><i data-icon="edit"></i></button>
    </div>
  </header>

  <div class="tile__body">

    <!-- Даты: две колонки, порядок полей постоянный. Пустая дата — прочерк,
         поле с места не уходит. Лейбл переносится до двух строк, если колонка
         уже подписи. -->
    <div class="tile__grid lc-deal-terms__grid">
      <div class="rof">
        <span class="ds-label ds-label--wrap"><span class="ds-label__text">Дата заключения</span></span>
        <div class="rof__row"><span class="rof__value" data-terms-field="signDate">01.01.2021</span></div>
      </div>
      <div class="rof">
        <span class="ds-label ds-label--wrap"><span class="ds-label__text">Дата окончания</span></span>
        <div class="rof__row"><span class="rof__value" data-terms-field="endDate">01.01.2023</span></div>
      </div>
      <div class="rof">
        <span class="ds-label ds-label--wrap"><span class="ds-label__text">Дата первой выдачи</span></span>
        <div class="rof__row"><span class="rof__value" data-terms-field="firstDisb">21.01.2021</span></div>
      </div>
    </div>

    <!-- Загрузка: каркас в той же сетке — подпись и значение каждого поля в
         габаритах строк (подпись 16px, значение 20px), чтобы раскладка не прыгнула
         после ответа. -->
    <div class="tile__grid lc-deal-terms__grid lc-deal-terms__loading" aria-busy="true">
      <div class="rof">
        <span class="sk-line" style="--sk-w:64%" aria-hidden="true"></span>
        <span class="sk-line sk-line--title" style="--sk-w:80px" aria-hidden="true"></span>
      </div>
      <div class="rof">
        <span class="sk-line" style="--sk-w:64%" aria-hidden="true"></span>
        <span class="sk-line sk-line--title" style="--sk-w:80px" aria-hidden="true"></span>
      </div>
      <div class="rof">
        <span class="sk-line" style="--sk-w:80%" aria-hidden="true"></span>
        <span class="sk-line sk-line--title" style="--sk-w:80px" aria-hidden="true"></span>
      </div>
    </div>

    <!-- Не заполнено, право на правку есть -->
    <div class="lc-deal-terms__fill">
      <button type="button" class="btn btn--accent btn--m" data-modal="deal-terms-scrim" data-modal-guarded>
        <span class="btn__label">Заполнить</span>
      </button>
    </div>

    <!-- Не заполнено, права нет: одна строка причины, действия нет -->
    <p class="lc-deal-terms__empty">Не заполнено</p>

  </div>
</section>
