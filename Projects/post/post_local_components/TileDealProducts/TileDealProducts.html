<!-- Локальный компонент «Продукты сделки» — фрагмент страницы сделки.
     Вшивается ассемблером (../../assemble.mjs) по метке ds-include на экране.
     Здесь только разметка: внешние отступы и место в колонках задаёт экран.
     data-state — состояние данных: loading | data | partial | empty | error | updating
     data-mode  — режим прав:       edit | view. Ставит страница: статус сделки,
                  не допускающий правку, даёт view при любой роли. В view
                  действия правки не рисуются (TileDealProducts.css)
     Сейчас компонент в состоянии empty: состав полей не согласован (см. паспорт). -->
<section class="tile lc-deal-products" data-state="empty" data-mode="edit">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Продукты сделки</h3></div>
    </div>
    <div class="tile__actions">
      <button type="button" class="btn btn--outline btn--xs"><i data-icon="add"></i><span class="btn__label">Продукт ДИД</span></button>
    </div>
  </header>
  <div class="tile__body">
    <div class="es es--m">
      <span class="illu es__illu" data-illu="empty-folder" aria-hidden="true"></span>
      <div class="es__body">
        <p class="es__title">Данные ещё не заведены</p>
      </div>
    </div>
  </div>
</section>
