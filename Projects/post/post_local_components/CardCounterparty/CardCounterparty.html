<!-- Локальный компонент «Карточка контрагента» — переиспользуемый.
     Вшивается ассемблером (../../assemble.mjs) по метке ds-include.

     Корень фрагмента — <template>: карточек на странице много и содержимое у
     них разное (наименование, состав полей), а через метку ds-include
     передаются только id/class/state/mode. Поэтому компонент отдаёт ЭТАЛОН
     разметки, а карточки по нему рисует потребитель из своего стора — так же,
     как реестр портфеля рисует 50 строк из mock-deals.js.

     data-state — где карточка лежит: found найден | member участник сделки
     data-mode  — режим прав:         edit (кнопка переноса есть) | view (её нет)

     Недоступность — не data-mode, а состояние Card из ДС: aria-disabled="true"
     плюс inert (ставит рендер по opts.disabled). Так показываются участники
     сделки другого вида в окне КНР: видны, но с текущей вкладки не трогаются.

     Что чем управляется. Риск-метрика, строка ГСЗ и чекбокс «КНР» осмыслены
     только у участника сделки — у найденного контрагента их нет. Сабхедер у
     юрлица необязателен («Нерезидент», «Консолидированная группа»), у физлица
     это дата рождения и он есть всегда. Состав полей — контент, а не вариант:
     у разных контрагентов он разный, и пустых строк под отсутствующее не
     резервируется.

     Раскладка тела — две колонки: слева реквизиты и чекбокс «КНР», справа
     риск-метрика. Колонки — flex-ряд, а не сетка: у найденного контрагента
     метрики нет, и пустая колонка со своим зазором не остаётся.

     Префикс классов lc-knrm__ исторический: карточка выросла из модалки КНР и
     эти классы держит её скрипт. Переименование стоило бы правок в окне без
     пользы для вида. -->

<!-- Корень — пустой скрытый контейнер вокруг шаблона. Он нужен по двум
     причинам: у фрагмента должен быть один корневой элемент, а приёмка читает
     разметку текстом и видит карточку внутри <template> как обычный тайл —
     поэтому зона помечена data-off-grid: ширину карточке задаёт колонка
     потребителя, а не 12-колоночная сетка страницы. -->
<div hidden
     data-off-grid="Эталон карточки контрагента: ширину задаёт колонка потребителя, а не сетка страницы">
<template id="lc-cpcard-tpl">
  <article class="tile tile--card lc-knrm__card" data-state="found" data-mode="edit">
    <header class="tile__header">
      <div class="tile__header-main">
        <div class="tile__title-row"><h3 class="tile__title" data-cp="name"></h3></div>
        <p class="tile__subtitle" data-cp="subheader"></p>
      </div>
      <div class="tile__actions">
        <!-- Перенос в соседнюю колонку — действие Card (IconButton M 20×20).
             Карточку не перетаскивают: её переносят этой кнопкой или двойным
             кликом. Подпись и подсказку («Перенести в участники сделки» /
             «Убрать из участников сделки») ставит рендер по opts.moveLabel.
             data-knr-move — хук переноса в окне КНР -->
        <button type="button" class="ibtn ibtn--neutral ibtn--m" data-knr-move
                aria-label="Перенести" data-tooltip="Перенести"><i data-icon="arrow-left-right"></i></button>
      </div>
    </header>
    <div class="tile__body">
      <div class="lc-knrm__content">
        <div class="lc-knrm__main">
          <div class="lc-knrm__fields" data-cp="fields"></div>
          <label class="cb lc-knrm__knr">
            <input type="checkbox" class="cb__input" data-cp="knr">
            <span class="cb__box"><span class="cb__mark"><i data-icon="check"></i></span></span>
            <span class="cb__content"><span class="cb__label">КНР</span></span>
          </label>
        </div>
        <!-- риск-метрику рантайм ds-riskmetric.js собирает сам из атрибутов -->
        <span data-cp="risk" data-riskmetric></span>
      </div>
    </div>
  </article>
</template>
</div>
