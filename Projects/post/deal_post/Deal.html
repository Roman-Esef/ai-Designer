<!DOCTYPE html>
<html lang="ru">
<head>
<script>window.__DS_ROOT = '../../../DS-IBP/';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сделка — IBP</title>
<link rel="icon" type="image/svg+xml" href="../../../DS-IBP/assets/logo.svg">
<link rel="stylesheet" href="../../../DS-IBP/ds.css">
<style>
  /* ---------- только раскладка экрана, на токенах ДС ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    margin: 0;
    font-family: var(--font-text), system-ui, sans-serif;
    color: var(--text-primary);
    background: var(--bg-page);
  }
</style>
</head>
<body>

<div class="nav-layout">

  <!-- Боковое меню строится экранным скриптом из ibp-home.js по роли -->
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню"></nav>

  <div class="screen screen--app">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="../mainPage/index.html">Главная</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="../Portfolio-did/Portfolio.html">Текущий портфель ДИД</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page" id="deal-crumb">Сделка</span>
      </li>
    </nav>

    <main class="screen__content">

      <!-- Шапка страницы -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row">
            <div class="phead__title-group">
              <h1 class="phead__title" id="deal-title">Сделка</h1>
            </div>
          </div>
        </div>
      </div>

      <!-- Состав страницы (тайлы сделки) собирается из локальных компонентов
           направления — Projects/post/post_local_components/. Их перечень и
           механика подключения согласуются отдельно. -->

    </main>
  </div>
</div>

<script src="../data/mock-deals.js"></script>
<script src="../data/deals-store.js"></script>
<script src="../../../DS-IBP/scripts/ds.js"></script>
<script src="../../../DS-IBP/scripts/ibp-home.js"></script>
<script>
/* Экранный скрипт: меню панели навигации строится из каталога ibp-home.js
   (window.IBPHome) по роли «Финансист ДИД»; пункт «Текущий портфель» selected —
   страница сделки открывается из реестра портфеля и остаётся его разделом. */
(function () {
  'use strict';
  var role = window.IBPHome.defaultRole;
  var SELECTED_ID = 'current-portfolio';
  /* строка пользователя в футере меню ведёт на хаб проектов (корневой index.html).
     Футер отдаёт IBPHome.footerHTML с зашитым href="#" — подменяем ссылку
     здесь, каталог ДС не трогаем. Проверяет сторож projects-hub.mjs. */
  var USER_LINK_FROM = ' href="#" aria-label="Открыть личный кабинет"';
  var USER_LINK_TO = ' href="../../../index.html" aria-label="Хаб проектов"';

  function ic(name) { return '<i data-icon=\'' + name + '\'></i>'; }

  function itemHTML(it) {
    /* пункт с тайлом-со-ссылками — аккордеон-родитель (под-пункты = ссылки тайла) */
    if (it.tile && it.tile.links && it.tile.links.length) {
      var sub = '<div class="nav__sub" id="nav-sub-' + it.id + '"><div class="nav__sub-in">'
        + it.tile.links.map(function (l) { return '<a class="nav__item" href="#"><span class="nav__label">' + l + '</span></a>'; }).join('')
        + '</div></div>';
      return '<a class="nav__item nav__item--acc" href="#" aria-expanded="false" aria-controls="nav-sub-' + it.id + '">'
        + '<span class="nav__ico">' + ic(it.icon) + '</span>'
        + '<span class="nav__label">' + it.label + '</span>'
        + '<span class="nav__caret">' + ic('chevron-down') + '</span></a>' + sub;
    }
    var badge = it.badge
      ? '<span class="nav__badge"><span class="badge badge--xs badge--accent" aria-hidden="true">' + it.badge + '</span></span>'
      : '';
    /* пункт «Текущий портфель» ведёт на реестр: со страницы сделки он остаётся
       рабочим переходом на уровень выше, а не мёртвой ссылкой */
    var href = (it.id === SELECTED_ID) ? '../Portfolio-did/Portfolio.html' : '#';
    var sel = (it.id === SELECTED_ID) ? ' nav__item--selected" aria-current="page' : '';
    return '<a class="nav__item' + sel + '" href="' + href + '"><span class="nav__ico">' + ic(it.icon) + '</span>'
      + '<span class="nav__label">' + it.label + '</span>' + badge + '</a>';
  }

  function buildNav() {
    var nav = document.getElementById('nav');
    var s = '<div class="nav__top">'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Свернуть меню">' + ic('left-menu') + '</button>'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель">' + ic('pin-menu') + '</button>'
      + '</div>';
    s += '<div class="nav__list">';
    s += '<a class="nav__item" href="../mainPage/index.html"><span class="nav__ico">' + ic('main-page') + '</span><span class="nav__label">Главная</span></a>';
    IBPHome.itemsFor(role).forEach(function (g, i) {
      s += '<div class="nav__block' + (i === 0 ? ' nav__block--first' : '') + '">';
      s += '<div class="nav__block-label">' + g.label + '</div>';
      g.items.forEach(function (it) { s += itemHTML(it); });
      s += '</div>';
    });
    s += '</div>';
    s += (window.IBPHome && window.IBPHome.footerHTML)
      ? window.IBPHome.footerHTML(role).replace(USER_LINK_FROM, USER_LINK_TO)
      : '<div class="nav__footer">'
        + '<a class="nav__user" href="../../../index.html" aria-label="Хаб проектов">'
        + '<span class="av av--circular av--m"><span class="av__text">АП</span></span>'
        + '<span class="nav__user-text">'
        + '<span class="nav__user-name">Александров Петр Константинович</span>'
        + '<span class="nav__user-role">' + role + '</span>'
        + '</span></a>'
        + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти"><i data-icon="logout"></i></button>'
        + '</div>';
    nav.innerHTML = s;
    if (window.DSNavPanel) window.DSNavPanel.bind(nav);
  }

  /* Сделка, которую открыли: номер приходит параметром ?id= — его ставит реестр
     текущего портфеля при двойном клике по строке. Данные читаются из общего
     DealsStore (той же базы, что рисует таблицу портфеля), поэтому наименование
     и номер на обоих экранах совпадают по построению. Открытие файла без
     параметра — просмотр каркаса: берётся первая сделка списка. */
  function currentDeal() {
    var id = null;
    try { id = new URLSearchParams(window.location.search).get('id'); } catch (e) { id = null; }
    var deal = (id != null && id !== '') ? window.DealsStore.byId(id) : null;
    return deal || window.DealsStore.list()[0] || null;
  }

  function fillDeal() {
    var deal = currentDeal();
    if (!deal) return;
    var label = 'Сделка № ' + deal.id;
    document.getElementById('deal-title').textContent = deal.name || label;
    document.getElementById('deal-crumb').textContent = label;
    document.title = label + ' — IBP';
  }

  function paintAll() {
    if (window.dsIcons) window.dsIcons.apply(document);
  }

  buildNav(); fillDeal(); paintAll();
})();
</script>

</body>
</html>
