     Вариант @js нужен потому, что F5 читает два входа — статическую разметку и
     атрибуты class из JS-шаблонов (экраны Post строят панель по роли). Без него
     «правило видит шаблон» доказывалось бы только на рабочих экранах.

<!DOCTYPE html>
